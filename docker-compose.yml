# Plotline — local/prod stack.
#   api        serves the warehouse (data/plotline.duckdb) as a JSON API
#   scheduler  (optional) runs the daily pipeline to refresh the warehouse
#
# Bring up the API:   docker compose up api
# Refresh data:       docker compose run --rm scheduler
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PLOTLINE_ENV=dev
      - PLOTLINE_API_KEYS=${PLOTLINE_API_KEYS:-demo-key}
      - PLOTLINE_CORS_ORIGINS=${PLOTLINE_CORS_ORIGINS:-*}
      # DATABASE_URL / PLOTLINE_WAREHOUSE_URL unset locally → static keys + mounted file.
    volumes:
      - ./data/plotline.duckdb:/app/data/plotline.duckdb:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 4s
      start_period: 25s
      retries: 3
    restart: unless-stopped

  # Runs the full medallion pipeline + rebuilds the warehouse, then exits.
  # Schedule it (cron / GitHub Actions / cloud scheduler) to refresh daily.
  scheduler:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: >
      bash -c "pip install -q -r requirements.txt && playwright install --with-deps chromium &&
               python run_pipeline.py --enrich 500 &&
               python -m src.scrapers.cover_crawler --all &&
               python -m src.db.warehouse"
    profiles: ["ops"]
