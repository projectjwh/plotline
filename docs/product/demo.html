<title>Plotline Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --base:#0A0C0F; --panel:#11151B; --raised:#171C24; --hover:#1D232D; --line:#232A34; --line-2:#2D3541;
  --text:#E9ECF1; --text-2:#B9C0CB; --muted:#8B94A3; --faint:#5E6775;
  --mark:#F2C94C; --mark-ink:#16130A; --mark-soft:rgba(242,201,76,.12);
  --up:#F04E54; --dn:#4A86EE; --up-soft:rgba(240,78,84,.14); --dn-soft:rgba(74,134,238,.14); --flat:#3A414C;
  --ok:#3FB87F; --warn:#E3A33B;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
:root.us{--up:#2BB673; --dn:#F0506A; --up-soft:rgba(43,182,115,.14); --dn-soft:rgba(240,80,106,.14)}
*{box-sizing:border-box}
html,body{background:var(--base)}
body{color:var(--text);font:14px/1.45 var(--ui);margin:0;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px;border-radius:4px}
.num,.mono,td,th{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.up{color:var(--up)} .dn{color:var(--dn)} .fl{color:var(--muted)}

/* ---------- top chrome ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(10,12,15,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;padding-block:10px;padding-inline:20px;max-width:1440px;margin:0 auto}
.logo{font:800 22px/1 var(--display);letter-spacing:-.03em;display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.logo b{background:linear-gradient(transparent 70%,var(--mark) 70% 94%,transparent 94%);padding-inline:1px;color:var(--text)}
.logo small{font:500 10px var(--mono);color:var(--muted);letter-spacing:.12em}
.nav{display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:6px 10px;border-radius:6px;color:var(--text-2);font-weight:500;white-space:nowrap;font-size:13.5px}
.nav a:hover{background:var(--raised);color:var(--text)}
.nav a[aria-current="page"]{color:var(--text);background:var(--raised);box-shadow:inset 0 -2px 0 var(--mark)}
.nav .pro{color:var(--mark)}
.tools{display:flex;gap:8px;align-items:center}
@media (max-width:1400px){.search{display:none!important}}
.search{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel);color:var(--muted);font-size:12.5px;min-width:200px}
.search kbd{font:500 10.5px var(--mono);border:1px solid var(--line-2);border-radius:4px;padding:0 5px;margin-left:auto}
.sel{height:32px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel);color:var(--text);padding:0 8px;font:500 12.5px var(--ui)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:0 10px;height:30px;font:600 11.5px var(--mono);color:var(--muted);cursor:pointer;letter-spacing:.04em}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--text)}
.iconbtn{height:32px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel);padding:0 10px;cursor:pointer;font:600 11.5px var(--mono);letter-spacing:.06em;color:var(--text-2)}
.iconbtn[aria-pressed="true"]{border-color:var(--mark);color:var(--mark)}

/* tape */
.tape{border-top:1px solid var(--line);overflow:hidden;position:relative;height:34px;display:flex;align-items:center;background:var(--base)}
.tape .lab{position:absolute;left:0;top:0;bottom:0;z-index:2;display:flex;align-items:center;gap:6px;padding:0 12px 0 20px;background:linear-gradient(90deg,var(--base) 80%,transparent);font:700 10.5px var(--mono);letter-spacing:.12em;color:var(--mark)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 var(--up);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--up) 60%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.track{display:flex;gap:28px;white-space:nowrap;animation:marq 70s linear infinite;padding-left:150px;will-change:transform}
.tape:hover .track{animation-play-state:paused}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk{display:inline-flex;gap:8px;align-items:baseline;font:500 12px var(--mono)}
.tk b{color:var(--text);font-weight:700}
.tk .px{color:var(--text-2)}

/* ---------- layout ---------- */
.wrap{max-width:1440px;margin:0 auto;padding-block:20px 80px;padding-inline:20px}
.grid{display:grid;gap:14px}
.g12{grid-template-columns:repeat(12,minmax(0,1fr))}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
@media (max-width:1100px){.c3,.c4{grid-column:span 6}.c5,.c7,.c8,.c9{grid-column:span 12}.c6{grid-column:span 12}}
@media (max-width:680px){.g12>*{grid-column:span 12!important}.bar{padding-inline:16px;gap:10px;flex-wrap:wrap}.wrap{padding-inline:16px}.search{display:none}.nav{order:3;flex-basis:100%}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph h3{margin:0;font:700 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-2);display:flex;gap:8px;align-items:center}
.ph h3 i{font-style:normal;color:var(--faint);font-weight:500}
.pb{padding:14px}
.eyebrow{font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.h1{font:800 clamp(28px,4vw,44px)/1 var(--display);letter-spacing:-.03em;margin:6px 0 0;text-wrap:balance}
.h2{font:800 22px/1.1 var(--display);letter-spacing:-.02em;margin:0}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.sub{color:var(--muted);font-size:13px;max-width:70ch;margin:6px 0 0}

/* index cards */
.idx{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ic{background:var(--panel);padding:12px 14px 8px;display:grid;gap:2px;cursor:pointer}
.ic:hover{background:var(--raised)}
.ic .code{font:700 11px var(--mono);letter-spacing:.08em;color:var(--text-2);display:flex;justify-content:space-between}
.ic .v{font:700 22px var(--display);letter-spacing:-.02em}
.ic .d{font:600 12px var(--mono)}
.ic svg{height:36px;width:100%;display:block;margin-top:4px}

/* breadth */
.breadth{display:grid;gap:8px}
.bb{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:transparent}
.bb span{display:block;height:100%}
.bl{display:flex;justify-content:space-between;font:600 12px var(--mono)}

/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel);position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
.r{text-align:right}
.tn{display:flex;align-items:center;gap:10px;min-width:0}
.tn .cv{width:26px;height:36px;border-radius:4px;background-size:cover;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.06)}
.tn b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.tn small{display:block;font:500 10.5px var(--mono);color:var(--muted);letter-spacing:.04em}
.chg{font:600 12.5px var(--mono);padding:2px 6px;border-radius:5px;display:inline-block;min-width:64px;text-align:right}
.chg.up{background:var(--up-soft)} .chg.dn{background:var(--dn-soft)}
.flash-up{animation:fu 1s}.flash-dn{animation:fd 1s}
@keyframes fu{0%{background:color-mix(in srgb,var(--up) 38%,transparent)}100%{}}
@keyframes fd{0%{background:color-mix(in srgb,var(--dn) 38%,transparent)}100%{}}

/* chips, buttons, pills */
.pill{display:inline-flex;align-items:center;gap:5px;font:600 10.5px var(--mono);letter-spacing:.06em;padding:3px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--text-2);white-space:nowrap}
.pill.mk{background:var(--mark-soft);border-color:transparent;color:var(--mark)}
.pill.ok{background:rgba(63,184,127,.12);border-color:transparent;color:var(--ok)}
.pill.warn{background:rgba(227,163,59,.12);border-color:transparent;color:var(--warn)}
.pill.up{background:var(--up-soft);border-color:transparent}
.pill.dn{background:var(--dn-soft);border-color:transparent}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--mark);background:var(--mark);color:var(--mark-ink);font:700 13px var(--ui);cursor:pointer;white-space:nowrap}
.btn.gh{background:transparent;color:var(--text);border-color:var(--line-2)}
.btn.gh:hover{background:var(--raised)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 10px;font:600 12px var(--ui);color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--raised);color:var(--text);border-color:var(--line-2)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.kv div{background:var(--panel);padding:10px 14px;display:grid;gap:2px}
.kv span{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kv b{font:600 15px var(--mono)}

/* treemap */
.tm{position:relative;height:460px;background:var(--base)}
.tm .grp{position:absolute;border:1px solid var(--base);overflow:hidden}
.tm .glab{position:absolute;left:0;top:0;right:0;height:18px;font:700 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-2);padding:3px 6px;background:rgba(10,12,15,.72);z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile{position:absolute;border:1px solid var(--base);display:grid;place-content:center;text-align:center;overflow:hidden;cursor:pointer;transition:filter .15s,background-color .6s}
.tile:hover{filter:brightness(1.25);z-index:2;outline:1px solid var(--text)}
.tile b{font:700 12px var(--mono);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.tile span{font:500 10.5px var(--mono);color:rgba(255,255,255,.88)}
.tile.big b{font-size:15px}
.legend-scale{display:flex;align-items:center;gap:6px;font:500 10.5px var(--mono);color:var(--muted)}
.legend-scale i{display:block;width:22px;height:10px}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--raised);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;font-size:12px;box-shadow:0 12px 30px rgba(0,0,0,.5);min-width:180px;display:grid;gap:4px}
.tip b{font:700 13px var(--ui)}
.tip .row{display:flex;justify-content:space-between;gap:14px;font:500 11.5px var(--mono);color:var(--text-2)}

/* IPO banner */
.ipo{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:linear-gradient(90deg,var(--mark-soft),transparent 30%),var(--panel)}
.ipo .lab{position:absolute;left:0;top:0;bottom:0;z-index:2;display:flex;flex-direction:column;justify-content:center;padding:0 22px 0 16px;background:linear-gradient(90deg,var(--panel) 75%,transparent)}
.ipo .lab b{font:800 18px/1 var(--display);letter-spacing:-.02em}
.ipo .lab small{font:600 10px var(--mono);color:var(--mark);letter-spacing:.14em}
.ipo .track{animation-duration:55s;padding-left:170px;gap:12px;padding-block:12px}
.ipo:hover .track{animation-play-state:paused}
.ic2{display:inline-flex;gap:10px;align-items:center;padding:6px 12px 6px 6px;border:1px solid var(--line-2);border-radius:10px;background:var(--raised)}
.ic2 .cv{width:34px;height:46px;border-radius:5px;background-size:cover}
.ic2 b{display:block;font:700 13px var(--ui)}
.ic2 small{display:block;font:500 11px var(--mono);color:var(--muted)}

/* covers + hero */
.cover{border-radius:10px;background-size:cover;background-position:center;aspect-ratio:3/4;box-shadow:0 20px 40px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06)}
.quote{display:grid;grid-template-columns:170px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:680px){.quote{grid-template-columns:96px minmax(0,1fr);gap:14px}}
.price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:10px}
.price .big{font:800 56px/1 var(--display);letter-spacing:-.04em}
.price .d{font:700 16px var(--mono)}
.meta{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12.5px}
.meta a{color:var(--text-2);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}

/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.axis text{fill:var(--muted);font:500 10px var(--mono)}
.gridl{stroke:var(--line);stroke-width:1}
.xh{stroke:var(--text-2);stroke-width:1;stroke-dasharray:3 3}

/* lock */
.lock{position:relative;min-height:190px}
.lock .blur{filter:blur(5px);opacity:.45;pointer-events:none;user-select:none}
.lock .ov{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;gap:8px;padding:16px;background:radial-gradient(closest-side,rgba(17,21,27,.92),rgba(17,21,27,.55))}
.lock .ov b{font:800 18px var(--display);letter-spacing:-.01em}
.lock .ov p{margin:0;color:var(--muted);font-size:12.5px;max-width:34ch}

/* galleries */
.post{display:grid;gap:10px}
.nick{font-weight:600;color:var(--text)}
.ip{font:500 11px var(--mono);color:var(--faint)}
.vb{display:inline-flex;align-items:center;gap:4px;font:700 10px var(--mono);padding:1px 6px;border-radius:4px;background:var(--mark);color:var(--mark-ink);letter-spacing:.06em}
tr.concept td:first-child{box-shadow:inset 3px 0 0 var(--mark)}
.cmt{display:grid;gap:4px;padding:12px 0;border-bottom:1px solid var(--line)}
.cmt.reply{padding-left:22px;border-left:2px solid var(--line-2);margin-left:6px}
.input{height:38px;border:1px solid var(--line-2);border-radius:8px;background:var(--base);display:flex;align-items:center;padding:0 12px;color:var(--muted);font-size:13px}
.input.area{height:110px;align-items:flex-start;padding-top:10px}
.field{display:grid;gap:6px}
.field label{font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.react{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border:1px solid var(--line-2);border-radius:999px;font:600 12.5px var(--mono);background:var(--raised)}

/* steps */
.steps{display:flex;gap:6px;flex-wrap:wrap;counter-reset:s}
.steps span{display:flex;gap:8px;align-items:center;padding:6px 12px 6px 6px;border:1px solid var(--line-2);border-radius:999px;font:600 12px var(--ui);color:var(--muted)}
.steps span::before{counter-increment:s;content:counter(s);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--raised);font:700 11px var(--mono)}
.steps span.done{color:var(--ok)}.steps span.done::before{content:"✓";background:rgba(63,184,127,.18)}
.steps span.on{color:var(--text);border-color:var(--mark)}.steps span.on::before{background:var(--mark);color:var(--mark-ink)}
.drop{border:1.5px dashed var(--line-2);border-radius:12px;padding:26px;text-align:center;color:var(--muted);display:grid;gap:6px;background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(255,255,255,.015) 10px 20px)}

/* plan cards */
.plan{display:grid;gap:12px;padding:18px;align-content:start}
.plan .pr{font:800 34px/1 var(--display);letter-spacing:-.03em}
.plan ul{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--text-2);font-size:13px}
.plan.feat{border-color:var(--mark);box-shadow:0 0 0 1px var(--mark) inset}

/* band */
.band{position:relative;height:46px;margin-top:10px}
.band .rail{position:absolute;left:0;right:0;top:20px;height:6px;border-radius:3px;background:var(--raised)}
.band .rng{position:absolute;top:14px;height:18px;border-radius:5px;background:var(--mark-soft);border:1px solid var(--mark)}
.band .mid{position:absolute;top:8px;width:2px;height:30px;background:var(--mark)}

/* hist */
.hist{display:grid;gap:5px}
.hist div{display:grid;grid-template-columns:18px 1fr 38px;gap:8px;align-items:center;font:500 11px var(--mono);color:var(--muted)}
.hist i{display:block;height:8px;border-radius:0 4px 4px 0;background:var(--mark)}

/* spec drawer */
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(380px,100%);background:var(--panel);border-left:1px solid var(--line-2);z-index:40;transform:translateX(100%);visibility:hidden;transition:transform .25s,visibility .25s;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 18px;overflow:auto;display:grid;gap:14px;align-content:start;box-shadow:-20px 0 40px rgba(0,0,0,.4)}
.drawer.open{transform:none;visibility:visible}
.drawer h4{margin:0;font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.drawer p{margin:0;color:var(--text-2);font-size:13px}
.kpi{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.kpi code{font:500 10.5px var(--mono);color:var(--muted);text-align:right}
.foot{margin-top:28px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--faint);font:500 11px var(--mono);letter-spacing:.04em}
.sample{color:var(--mark)}

/* live demo controls */
.in,.ta{width:100%;border:1px solid var(--line-2);border-radius:8px;background:var(--base);color:var(--text);font:14px var(--ui);padding:8px 10px}
.in{height:36px}.ta{resize:vertical;min-height:60px}
.in:focus,.ta:focus{outline:2px solid var(--mark);outline-offset:1px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--text-2)}
.scores{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.sc{height:32px;border:1px solid var(--line-2);border-radius:6px;background:var(--raised);font:700 12px var(--mono);cursor:pointer;color:var(--text-2)}
.sc:hover{border-color:var(--mark)}.sc.on{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.lnk{border:0;background:none;padding:0;color:var(--text-2);font:inherit;text-decoration:underline;cursor:pointer}
.btn[disabled]{opacity:.45;cursor:not-allowed}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translate(-50%,20px);opacity:0;background:var(--raised);border:1px solid var(--mark);color:var(--text);padding:10px 16px;border-radius:10px;font-size:13px;z-index:60;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.field select.sel{width:100%}
@media (prefers-reduced-motion:reduce){.track{animation:none!important}.dot{animation:none}.flash-up,.flash-dn{animation:none}.drawer{transition:none}}
</style>

<header class="top">
  <div class="bar">
    <a class="logo" href="#market"><b>plotline</b><small>STORY-IP MARKET</small></a>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="tools">
      <div class="search" aria-hidden="true">⌕ Search titles, tickers, authors<kbd>/</kbd></div>
      <label class="sr" for="persona" style="position:absolute;left:-9999px">Preview as</label>
      <select class="sel" id="persona" title="Preview premium screens as a persona (design review only)">
        <option value="fan">Preview: Fan</option><option value="author">Preview: Author</option><option value="publisher">Preview: Publisher</option><option value="investor">Preview: Investor</option>
      </select>
      <div class="seg" role="group" aria-label="Up/down colors"><button type="button" id="cvKR" aria-pressed="true" title="Red up, blue down">KR</button><button type="button" id="cvUS" aria-pressed="false" title="Green up, red down">US</button></div>
      <button type="button" class="iconbtn" id="specBtn" aria-pressed="false">SPEC</button>
    </div>
  </div>
  <div class="tape" aria-label="Top movers ticker"><div class="lab"><span class="dot"></span>LIVE*</div><div class="track" id="tape"></div></div>
</header>

<main class="wrap" id="view"></main>
<aside class="drawer" id="drawer" aria-label="Spec notes"></aside>
<div class="tip" id="tip" hidden></div>

<script>
/* ============ seeded sample data ============ */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(20260925);const pick=a=>a[Math.floor(R()*a.length)];
const GENRES=[["FANTASY","Fantasy",38],["ROMFAN","Romance fantasy",26],["ACTION","Action",22],["MURIM","Murim",14],["BL","BL",12],["THRILL","Thriller",11],["DRAMA","Drama",10],["SLICE","Slice of life",7],["HORROR","Horror",6],["SCIFI","Sci-fi",5]];
const PUBS=["Studio Nara","Moonbeam Media","Kite & Quill","Redline Comics","Hanok Press","Blue Lantern","Parallax Ink","Independent"];
const PLATS=["Webtoon","Tapas","Tappytoon","Manta","Royal Road","Webnovel","Wattpad","Lezhin","Naver","Kakao"];
const W1=["Tower","Salt","Nine","Glass","Red","Paper","Iron","Silent","Ember","Hollow","Velvet","Last","Crown","Ash","Moon","Winter","Ghost","Golden","Broken","Starfall","Cinder","Jade","Mirror","Thorn","Hundredth"];
const W2=["Ash","Archivist","Lanterns","Orchard","Ledger","Moth","Regent","Tide","Garden","Knight","Contract","Heir","Oath","Library","Blade","Duchess","Radio","Sect","Dungeon","Villainess","Protocol","Carnival","Sword","Return","Queen"];
const AUTH=["H. Seo","K. Lim","M. Arden","J. Park","R. Okafor","S. Tanaka","L. Moreau","D. Kwon","A. Reyes","Y. Chen","P. Novak","E. Han","T. Baek","N. Ito","C. Vale"];
const used=new Set();const titles=[];const DAYS=120;
for(let i=0;i<64;i++){
  let nm;do{nm=(R()<.35?"The ":"")+pick(W1)+" "+pick(W2)}while(used.has(nm));used.add(nm);
  const g=GENRES[Math.min(GENRES.length-1,Math.floor(Math.pow(R(),1.3)*GENRES.length))];
  const words=nm.replace("The ","").split(" ");
  let tk=(words[0].slice(0,2)+words[1].slice(0,2)).toUpperCase();while(titles.some(t=>t.tk===tk))tk=tk.slice(0,3)+String.fromCharCode(65+Math.floor(R()*26));
  const novel=R()<.38;const listed=i>=56?Math.floor(1+R()*27):DAYS+Math.floor(R()*900);
  const base=35+R()*55,mu=(R()-.45)*.18,vol=.6+R()*1.6;const s=[];let v=base;
  for(let d=0;d<DAYS;d++){v=Math.max(8,Math.min(99.4,v+mu+(R()-.5)*vol));s.push(+v.toFixed(1))}
  if(listed<DAYS){for(let d=0;d<DAYS-listed;d++)s[d]=null;let x=45+R()*30;for(let d=DAYS-listed;d<DAYS;d++){x=Math.min(99,x+(R()-.3)*2.2);s[d]=+x.toFixed(1)}}
  const views=Math.round(Math.pow(10,5.5+R()*3.6)*(s[DAYS-1]/60));
  titles.push({i,tk,name:nm,g:g[0],gname:g[1],novel,plat:pick(PLATS),pub:pick(PUBS),author:pick(AUTH),s,listed,views,
    subs:Math.round(views*(.002+R()*.01)),fan:+(6.2+R()*3.3).toFixed(1),votes:Math.round(200+R()*16000),
    act:Math.round(40+R()*R()*9000),wish:Math.round(R()*R()*70000),status:pick(["Ongoing","Ongoing","Ongoing","Completed","Hiatus"]),
    eps:Math.round(12+R()*260),cad:+(pick([1,1,1,2,3,5,7])*(novel?1.5:1)).toFixed(1),hue:Math.floor(R()*360),hue2:Math.floor(R()*360),pat:Math.floor(R()*4)});
}
const last=t=>t.s[DAYS-1],prev=(t,k)=>t.s[DAYS-1-k];
function chg(t,k=1){const p=prev(t,k);return p==null?null:(last(t)-p)/p*100}
titles.forEach(t=>{t.d1=chg(t,1);t.d7=chg(t,7);t.d30=chg(t,30)});
function ranks(day){const a=titles.filter(t=>t.s[day]!=null).sort((x,y)=>y.s[day]-x.s[day]);const m={};a.forEach((t,i)=>m[t.tk]=i+1);return m}
let RK=ranks(DAYS-1);const RK7=ranks(DAYS-8);
titles.forEach(t=>{t.rank=RK[t.tk];t.rd=RK7[t.tk]!=null?RK7[t.tk]-t.rank:null});
const byTk=Object.fromEntries(titles.map(t=>[t.tk,t]));
function indexSeries(list){const out=[];let b=null;for(let d=0;d<DAYS;d++){let num=0,w=0;list.forEach(t=>{if(t.s[d]!=null){num+=t.s[d]*t.views;w+=t.views}});const v=w?num/w:null;if(b==null&&v!=null)b=v;out.push(v==null?null:v/b*1000)}return out}
function mkIndex(code,name,list){const s=indexSeries(list);const l=s[DAYS-1],p=s[DAYS-2];return{code,name,s,v:l,d:(l-p)/p*100,list}}
let INDEX=[mkIndex("PLT-ALL","All titles",titles),mkIndex("PLT-CMX","Comics",titles.filter(t=>!t.novel)),mkIndex("PLT-NOV","Novels",titles.filter(t=>t.novel)),...GENRES.map(g=>mkIndex(g[0],g[1],titles.filter(t=>t.g===g[0]))).filter(x=>x.list.length)];

/* ============ helpers ============ */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtN=n=>n>=1e9?(n/1e9).toFixed(2)+"B":n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"K":String(n);
const sgn=v=>v==null?"—":(v>0?"▲ ":v<0?"▼ ":"")+Math.abs(v).toFixed(2)+"%";
const cls=v=>v==null||Math.abs(v)<.005?"fl":v>0?"up":"dn";
const chip=v=>`<span class="chg ${cls(v)}">${sgn(v)}</span>`;
const rkd=v=>v==null?'<span class="fl">new</span>':v===0?'<span class="fl">–</span>':`<span class="${v>0?'up':'dn'} mono">${v>0?'▲':'▼'}${Math.abs(v)}</span>`;
const coverCache={};
function cover(t){if(coverCache[t.tk])return coverCache[t.tk];const c=document.createElement("canvas");c.width=180;c.height=240;const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,180,240);g.addColorStop(0,`hsl(${t.hue} 55% 38%)`);g.addColorStop(1,`hsl(${t.hue2} 60% 14%)`);x.fillStyle=g;x.fillRect(0,0,180,240);
  x.globalAlpha=.18;x.fillStyle="#fff";
  if(t.pat===0){for(let yy=0;yy<240;yy+=9)for(let xx=(yy/9%2)*4.5;xx<180;xx+=9){x.beginPath();x.arc(xx,yy,1.2+yy/240*2.4,0,7);x.fill()}}
  else if(t.pat===1){x.lineWidth=2;x.strokeStyle="#fff";for(let k=-240;k<180;k+=14){x.beginPath();x.moveTo(k,240);x.lineTo(k+240,0);x.stroke()}}
  else if(t.pat===2){for(let r=20;r<260;r+=18){x.beginPath();x.arc(150,40,r,0,7);x.lineWidth=1.5;x.strokeStyle="#fff";x.stroke()}}
  else{for(let k=0;k<7;k++){x.fillRect(0,k*36,180,12)}}
  x.globalAlpha=1;x.fillStyle="rgba(0,0,0,.35)";x.fillRect(0,170,180,70);
  x.fillStyle="#fff";x.font="800 54px 'Bricolage Grotesque',Arial Black,sans-serif";x.fillText(t.tk.slice(0,2),14,70);
  x.font="700 13px 'JetBrains Mono',monospace";x.fillStyle="rgba(255,255,255,.85)";
  const w=t.name.toUpperCase().split(" ");let line="",yy=196;w.forEach(wd=>{if((line+" "+wd).length>16){x.fillText(line.trim(),14,yy);yy+=16;line=wd}else line+=" "+wd});x.fillText(line.trim(),14,yy);
  return coverCache[t.tk]=c.toDataURL("image/png")}
const tname=t=>`<div class="tn"><span class="cv" style="background-image:url(${cover(t)})"></span><span><b>${esc(t.name)}</b><small>${t.tk} · ${t.gname}${t.novel?' · NOVEL':''}</small></span></div>`;
function spark(s,w=160,h=36,color){const v=s.filter(x=>x!=null);if(v.length<2)return"";const off=s.length-v.length;const mn=Math.min(...v),mx=Math.max(...v);const sx=w/(s.length-1),y=q=>h-3-(q-mn)/((mx-mn)||1)*(h-6);
  const pts=v.map((q,i)=>`${((i+off)*sx).toFixed(1)},${y(q).toFixed(1)}`);const col=color||(v[v.length-1]>=v[0]?"var(--up)":"var(--dn)");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="M${pts.join("L")}L${w},${h}L${(off*sx).toFixed(1)},${h}Z" fill="${col}" opacity=".12"/><path d="M${pts.join("L")}" fill="none" stroke="${col}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`}
const panel=(title,body,right="",extra="")=>`<section class="panel ${extra}"><div class="ph"><h3>${title}</h3>${right}</div>${body}</section>`;
const persona=()=>STATE.persona;const isPro=()=>["author","publisher","investor"].includes(STATE.persona);
function lock(title,inner){if(isPro())return inner;return `<div class="lock"><div class="blur">${inner}</div><div class="ov"><span class="pill mk">PRO</span><b>${title}</b><p>For verified authors, publishers and IP investors. Verification is by document review.</p><a class="btn sm" href="#plans">See plans</a></div></div>`}

/* ============ charts ============ */
function lineChart(series,{h=240,label="PlotScore",id="lc",band=false}={}){
  const W=760,H=h,pl=40,pr=12,pt=12,pb=24;const v=series.filter(x=>x!=null);const off=series.length-v.length;
  let mn=Math.min(...v),mx=Math.max(...v);const pad=(mx-mn)*.12||1;mn-=pad;mx+=pad;
  const sx=i=>pl+(i)/(series.length-1)*(W-pl-pr),sy=q=>pt+(1-(q-mn)/(mx-mn))*(H-pt-pb);
  const ticks=[];const step=niceStep((mx-mn)/4);for(let q=Math.ceil(mn/step)*step;q<=mx;q+=step)ticks.push(q);
  const d=v.map((q,i)=>`${sx(i+off).toFixed(1)},${sy(q).toFixed(1)}`).join("L");const col=v[v.length-1]>=v[0]?"var(--up)":"var(--dn)";
  const xl=[0,30,60,90,119].filter(i=>i>=off).map(i=>`<text x="${sx(i)}" y="${H-6}" text-anchor="middle">${i===119?"Today":"−"+(119-i)+"d"}</text>`).join("");
  return `<div class="chart" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${label} over 120 days">
   <g class="axis">${ticks.map(q=>`<line class="gridl" x1="${pl}" x2="${W-pr}" y1="${sy(q)}" y2="${sy(q)}"/><text x="${pl-6}" y="${sy(q)+3}" text-anchor="end">${q.toFixed(step<1?1:0)}</text>`).join("")}${xl}</g>
   <path d="M${d}L${sx(series.length-1)},${H-pb}L${sx(off)},${H-pb}Z" fill="${col}" opacity=".10"/>
   <path d="M${d}" fill="none" stroke="${col}" stroke-width="2"/>
   <circle cx="${sx(series.length-1)}" cy="${sy(v[v.length-1])}" r="4" fill="${col}" stroke="var(--panel)" stroke-width="2"/>
   <line class="xh" id="${id}-x" x1="0" x2="0" y1="${pt}" y2="${H-pb}" visibility="hidden"/><circle id="${id}-d" r="4" fill="var(--text)" visibility="hidden"/>
   <rect x="${pl}" y="${pt}" width="${W-pl-pr}" height="${H-pt-pb}" fill="transparent" data-hit="${id}"/></svg></div>`;
}
function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(r)));const f=r/p;return(f<1.5?1:f<3?2:f<7?5:10)*p}
function wireChart(id,series,fmt=q=>q.toFixed(1)){
  const hit=document.querySelector(`[data-hit="${id}"]`);if(!hit)return;const svg=hit.ownerSVGElement;const tip=$("tip");
  const W=760,pl=40,pr=12;const v=series.filter(x=>x!=null);let mn=Math.min(...v),mx=Math.max(...v);const pad=(mx-mn)*.12||1;mn-=pad;mx+=pad;
  const H=svg.viewBox.baseVal.height,pt=12,pb=24;const sy=q=>pt+(1-(q-mn)/(mx-mn))*(H-pt-pb);
  hit.addEventListener("mousemove",e=>{const b=svg.getBoundingClientRect();const x=(e.clientX-b.left)/b.width*W;let i=Math.round((x-pl)/(W-pl-pr)*(series.length-1));i=Math.max(0,Math.min(series.length-1,i));if(series[i]==null)return;
    const cx=pl+i/(series.length-1)*(W-pl-pr);const xl=$(id+"-x"),dt=$(id+"-d");xl.setAttribute("x1",cx);xl.setAttribute("x2",cx);xl.setAttribute("visibility","visible");dt.setAttribute("cx",cx);dt.setAttribute("cy",sy(series[i]));dt.setAttribute("visibility","visible");
    tip.hidden=false;tip.innerHTML=`<div class="row"><span>${i===119?"Today":(119-i)+" days ago"}</span></div><b class="mono">${fmt(series[i])}</b>`;tip.style.left=Math.min(innerWidth-200,e.clientX+14)+"px";tip.style.top=(e.clientY-10)+"px"});
  hit.addEventListener("mouseleave",()=>{tip.hidden=true;$(id+"-x").setAttribute("visibility","hidden");$(id+"-d").setAttribute("visibility","hidden")});
}

/* squarified treemap */
function squarify(items,x,y,w,h){const out=[];let rest=items.slice();const total=rest.reduce((a,b)=>a+b.v,0);const scale=w*h/total;rest=rest.map(o=>({...o,a:o.v*scale}));
  while(rest.length){const short=Math.min(w,h);let row=[rest[0]],i=1;const worst=r=>{const s=r.reduce((a,b)=>a+b.a,0);const mxx=Math.max(...r.map(o=>o.a)),mnn=Math.min(...r.map(o=>o.a));return Math.max(short*short*mxx/(s*s),s*s/(short*short*mnn))};
    while(i<rest.length&&worst(row.concat(rest[i]))<=worst(row)){row.push(rest[i]);i++}
    const s=row.reduce((a,b)=>a+b.a,0);if(w>=h){const cw=s/h;let cy=y;row.forEach(o=>{const ch=o.a/cw;out.push({...o,x,y:cy,w:cw,h:ch});cy+=ch});x+=cw;w-=cw}else{const rh=s/w;let cx=x;row.forEach(o=>{const cw=o.a/rh;out.push({...o,x:cx,y,w:cw,h:rh});cx+=cw});y+=rh;h-=rh}
    rest=rest.slice(i)}return out}
function heat(v){if(v==null)return"var(--flat)";const k=Math.min(1,Math.abs(v)/3);return `color-mix(in srgb, ${v>=0?'var(--up)':'var(--dn)'} ${Math.round(18+k*72)}%, var(--flat))`}
function renderTreemap(el,groupBy="g",metric="d1"){
  const W=el.clientWidth,H=el.clientHeight;const groups={};titles.forEach(t=>{const k=groupBy==="g"?t.gname:t.pub;(groups[k]=groups[k]||[]).push(t)});
  const gi=Object.entries(groups).map(([k,l])=>({k,l,v:l.reduce((a,t)=>a+Math.sqrt(t.views),0)})).sort((a,b)=>b.v-a.v);
  let html="";squarify(gi,0,0,W,H).forEach(g=>{html+=`<div class="grp" style="left:${g.x}px;top:${g.y}px;width:${g.w}px;height:${g.h}px"><div class="glab">${esc(g.k)}</div>`;
    squarify(g.l.map(t=>({t,v:Math.sqrt(t.views)})).sort((a,b)=>b.v-a.v),0,18,g.w,Math.max(1,g.h-18)).forEach(o=>{const t=o.t;const val=t[metric];const big=o.w>90&&o.h>54;
      html+=`<a class="tile${big?' big':''}" href="#title-${t.tk}" data-tip="${t.tk}" data-live-tile="${t.tk}" style="left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px;background-color:${heat(val)}">${o.w>44&&o.h>26?`<b>${t.tk}</b>`:''}${o.w>52&&o.h>40?`<span>${sgn(val).replace("▲ ","+").replace("▼ ","−")}</span>`:''}</a>`});html+="</div>"});
  el.innerHTML=html;el.dataset.metric=metric;
  el.querySelectorAll("[data-tip]").forEach(a=>{a.addEventListener("mousemove",e=>showTip(e,byTk[a.dataset.tip]));a.addEventListener("mouseleave",()=>$("tip").hidden=true)})}
function showTip(e,t){const tip=$("tip");tip.hidden=false;tip.innerHTML=`<b>${esc(t.name)}</b><div class="row"><span>${t.tk} · ${t.gname}</span><span>#${t.rank}</span></div><div class="row"><span>PlotScore</span><span>${last(t).toFixed(1)}</span></div><div class="row"><span>1D</span><span class="${cls(t.d1)}">${sgn(t.d1)}</span></div><div class="row"><span>1W</span><span class="${cls(t.d7)}">${sgn(t.d7)}</span></div><div class="row"><span>Reach</span><span>${fmtN(t.views)}</span></div><div class="row"><span>Fan activity</span><span>${fmtN(t.act)}/d</span></div>`;
  tip.style.left=Math.min(innerWidth-220,e.clientX+14)+"px";tip.style.top=Math.min(innerHeight-180,e.clientY+14)+"px"}

/* ============ tables ============ */
function moverTable(list,cols=["rank","name","px","d1","act"],opts={}){
  const H={rank:'<th class="r">#</th>',name:"<th>Title</th>",px:'<th class="r">PlotScore</th>',d1:'<th class="r">1D</th>',d7:'<th class="r">1W</th>',d30:'<th class="r">1M</th>',rd:'<th class="r">Rank 7D</th>',act:'<th class="r">Fan vol.</th>',views:'<th class="r">Reach</th>',fan:'<th class="r">Fan ★</th>',plat:"<th>Platform</th>",spark:"<th>90D</th>",wish:'<th class="r">Wishlist</th>',status:"<th>Status</th>",pub:"<th>Publisher</th>",rev:'<th class="r">Rev/mo (model)</th>',ready:'<th class="r">Readiness</th>'};
  const C={rank:t=>`<td class="r mono fl">${t.rank}</td>`,name:t=>`<td>${tname(t)}</td>`,px:t=>`<td class="r mono" data-live="${t.tk}" data-f="px">${last(t).toFixed(1)}</td>`,d1:t=>`<td class="r" data-live="${t.tk}" data-f="d1">${chip(t.d1)}</td>`,d7:t=>`<td class="r">${chip(t.d7)}</td>`,d30:t=>`<td class="r">${chip(t.d30)}</td>`,rd:t=>`<td class="r">${rkd(t.rd)}</td>`,
    act:t=>`<td class="r mono">${fmtN(t.act)}</td>`,views:t=>`<td class="r mono">${fmtN(t.views)}</td>`,fan:t=>`<td class="r mono">${t.fan}</td>`,plat:t=>`<td>${t.plat}</td>`,spark:t=>`<td style="width:110px">${spark(t.s.slice(-90),100,26)}</td>`,wish:t=>`<td class="r mono">${fmtN(t.wish)}</td>`,
    status:t=>`<td><span class="pill ${t.status==="Completed"?"ok":t.status==="Hiatus"?"warn":""}">${t.status}</span></td>`,pub:t=>`<td>${t.pub}</td>`,rev:t=>`<td class="r mono">$${fmtN(Math.round(t.views*.00003*.4))}–${fmtN(Math.round(t.views*.00003*2.5))}</td>`,ready:t=>`<td class="r mono">${readiness(t)}</td>`};
  return `<div class="tw"${opts.max?` style="max-height:${opts.max}px"`:''}><table><thead><tr>${cols.map(c=>H[c]).join("")}</tr></thead><tbody>${list.map(t=>`<tr data-go="title-${t.tk}">${cols.map(c=>C[c](t)).join("")}</tr>`).join("")}</tbody></table></div>`}
function readiness(t){const reach=Math.min(1,Math.log10(t.views)/9.5),comp=t.status==="Completed"?1:t.status==="Hiatus"?.3:.6,mom=Math.max(0,Math.min(1,((t.d30||0)+10)/20)),depth=Math.min(1,t.eps/100);return Math.round(100*(.3*reach+.18*comp+.12*mom+.1*depth+.15*.75+.15*Math.min(1,t.fan/10)))}

/* ============ pages ============ */
const TOPS=()=>{const live=titles.filter(t=>t.d1!=null);return{gain:[...live].sort((a,b)=>b.d1-a.d1),lose:[...live].sort((a,b)=>a.d1-b.d1),vol:[...titles].sort((a,b)=>b.act-a.act),ipo:titles.filter(t=>t.listed<DAYS).sort((a,b)=>a.listed-b.listed)}};
function ipoBanner(){const l=TOPS().ipo;const item=t=>{const since=(last(t)-t.s[DAYS-t.listed])/t.s[DAYS-t.listed]*100;return `<a class="ic2" href="#title-${t.tk}"><span class="cv" style="background-image:url(${cover(t)})"></span><span><b>${esc(t.name)}</b><small>${t.tk} · ${t.plat} · listed ${t.listed}d ago</small></span><span class="chg ${cls(since)}">${sgn(since)}</span></a>`};
  return `<div class="ipo"><div class="lab"><small>NEW LISTINGS</small><b>Just launched</b></div><div class="track">${l.map(item).join("")}${l.map(item).join("")}</div></div>`}

const P={};
P.market=()=>{const T=TOPS();const adv=titles.filter(t=>t.d1>0).length,dec=titles.filter(t=>t.d1<0).length,unch=titles.length-adv-dec;
 const nh=titles.filter(t=>last(t)>=Math.max(...t.s.filter(x=>x!=null))).length;
 return `<div class="pagehead"><div><div class="eyebrow">Market overview · ${new Date(2026,8,25).toDateString()} · <span class="sample">sample data</span></div><h1 class="h1">The story-IP market today</h1></div>
 <div class="acts"><span class="pill up">▲ ${adv} advancing</span><span class="pill dn">▼ ${dec} declining</span><span class="pill">${nh} at 120-day high</span></div></div>

/* ================= LIVE LAYER: shared community data through the artifact db ================= */

const LIVE = {db: null, user: null, uid: null, admin: false, writable: null, status: "connecting", ver: 0,
  data: Object.fromEntries(COLLS.map(c => [c, {}])), mine: {}, mod: {hidden: {}, approved: {}, rejected: {}}, seed: []};

/* ---------- boot ---------- */
(async () => {
  const C = window.claude;
  if (!C || !C.use) { LIVE.status = "offline"; rerender(); return; }
  const [db, user] = await Promise.all([C.use("db"), C.use("user")]);
  LIVE.user = user;
  if (!db) { LIVE.status = "offline"; rerender(); return; }
  LIVE.db = db;
  if (user) {
    LIVE.uid = await user.id();
    LIVE.admin = await user.canEdit();
    LIVE.writable = await user.can("data.write");
  }
  LIVE.status = "live";
  const fail = e => { if (e && e.code !== "unavailable") { LIVE.status = "error"; schedule(); } };
  COLLS.forEach(c => db.collection(c).onSnapshot(s => {
    const m = {};
    s.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); });
    const me = s.docs.find(d => d.id === LIVE.uid);
    if (me && !me.metadata.hasPendingWrites) delete LIVE.mine[c];   // server caught up with our own writes
    LIVE.data[c] = m; LIVE.ver++; schedule();
  }, fail));
  db.doc("mod/state").onSnapshot(d => { const x = d.exists ? d.data() : {}; LIVE.mod = {hidden: x.hidden || {}, approved: x.approved || {}, rejected: x.rejected || {}}; LIVE.ver++; schedule(); }, fail);
  db.doc("seed/posts").onSnapshot(d => { LIVE.seed = d.exists ? (d.data().items || []) : []; LIVE.ver++; schedule(); }, fail);
  schedule();
})();

/* ---------- render scheduling: never clobber a half-typed form ---------- */
let rafPending = false, deferred = false;
function typing() { const a = document.activeElement; return a && a.closest && a.closest("#view") && /INPUT|TEXTAREA|SELECT/.test(a.tagName); }
function schedule() {
  if (rafPending) return; rafPending = true;
  requestAnimationFrame(() => { rafPending = false; if (typing()) { deferred = true; return; } rerender(); });
}
document.addEventListener("focusout", () => setTimeout(() => { if (deferred && !typing()) { deferred = false; rerender(); } }, 0));
function rerender() { const y = window.scrollY; renderView(); window.scrollTo(0, y); }

/* ---------- writes (each viewer writes only their own document) ---------- */
const queues = {};
function mine(c) { return LIVE.mine[c] || LIVE.data[c][LIVE.uid] || {}; }
function canWrite() { return !!(LIVE.db && LIVE.uid && LIVE.writable !== false); }
async function saveDoc(path, body) {
  const run = () => LIVE.db.doc(path).set(body);
  queues[path] = (queues[path] || Promise.resolve()).then(run, run);
  return queues[path];
}
async function saveMine(c, mutate) {
  if (!canWrite()) { toast(LIVE.status === "live" ? "You can read this demo but not post. Ask the owner for Contributor access." : "Live data isn't available in this view."); return false; }
  const body = mutate(JSON.parse(JSON.stringify(mine(c))));
  LIVE.mine[c] = body; LIVE.ver++; schedule();
  try { await saveDoc(`${c}/${LIVE.uid}`, body); return true; }
  catch (e) { delete LIVE.mine[c]; LIVE.ver++; schedule(); writeError(e); return false; }
}
async function saveMod(mutate) {
  const body = mutate(JSON.parse(JSON.stringify(LIVE.mod)));
  try { await saveDoc("mod/state", body); return true; } catch (e) { writeError(e); return false; }
}
function writeError(e) {
  if (e && e.code === "invalid_argument") { LIVE.writable = false; toast("Your access level can't save here. Ask the owner for Contributor access."); }
  else if (e && e.code === "quota_exceeded") toast("The demo database is full. Ask the owner to clear old posts.");
  else toast("Couldn't save. Check your connection and try again.");
  schedule();
}
function toast(msg) {
  let t = document.getElementById("toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.className = "show"; clearTimeout(t._h); t._h = setTimeout(() => t.className = "", 3600);
}
const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

/* ---------- derived views (memoized per data version) ---------- */
const memo = {};
function M(key, fn) { if (memo[key] && memo[key].v === LIVE.ver) return memo[key].x; const x = fn(); memo[key] = {v: LIVE.ver, x}; return x; }
function flat(c) { const out = []; for (const [uid, d] of Object.entries(LIVE.data[c])) (d.items || []).forEach(x => out.push({...x, uid})); if (LIVE.uid && LIVE.mine[c]) { for (let i = out.length - 1; i >= 0; i--) if (out[i].uid === LIVE.uid) out.splice(i, 1); (LIVE.mine[c].items || []).forEach(x => out.push({...x, uid: LIVE.uid})); } return out; }
function docsOf(c) { const d = {...LIVE.data[c]}; if (LIVE.uid && LIVE.mine[c]) d[LIVE.uid] = LIVE.mine[c]; return d; }
const allPosts = () => M("posts", () => [...LIVE.seed.map(p => ({...p, uid: null, seed: true})), ...flat("posts")].filter(p => !LIVE.mod.hidden[p.id]).sort((a, b) => b.at - a.at));
const allComments = () => M("comments", () => flat("comments").filter(c => !LIVE.mod.hidden[c.id]).sort((a, b) => a.at - b.at));
const tallies = () => M("tallies", () => { const t = {}; for (const d of Object.values(docsOf("votes"))) for (const [id, v] of Object.entries(d.v || {})) { const x = t[id] || (t[id] = {up: 0, down: 0}); v > 0 ? x.up++ : x.down++; } return t; });
function votesFor(p) { const x = tallies()[p.id] || {up: 0, down: 0}; return {up: x.up + (p.up0 || 0), down: x.down}; }
function isConcept(p) { const v = votesFor(p); return v.up >= CONCEPT.up && v.up / Math.max(1, v.up + v.down) >= CONCEPT.ratio; }
const allClaims = () => M("claims", () => flat("claims").map(c => ({...c, status: LIVE.mod.approved[c.id] ? "approved" : LIVE.mod.rejected[c.id] ? "rejected" : "pending"})).sort((a, b) => b.at - a.at));
function approvedClaims(uid) { return allClaims().filter(c => c.uid === uid && c.status === "approved"); }
function ownsTitle(uid, t) { return !!uid && approvedClaims(uid).some(c => (c.type === "title" && c.ref === t.tk) || (c.type === "author" && c.ref === t.author) || (c.type === "publisher" && c.ref === t.pub)); }
function ratingFor(t) {
  return M("rating:" + t.tk, () => {
    const s = []; let excluded = 0;
    for (const [uid, d] of Object.entries(docsOf("ratings"))) { const r = (d.r || {})[t.tk]; if (!r) continue; if (ownsTitle(uid, t)) { excluded++; continue; } s.push(r.score); }
    const n = s.length, sum = s.reduce((a, b) => a + b, 0), hist = Array.from({length: 10}, (_, i) => s.filter(x => x === 10 - i).length);

}
function reviewsFor(t) { const out = []; for (const [uid, d] of Object.entries(docsOf("ratings"))) { const r = (d.r || {})[t.tk]; if (r && r.review) out.push({uid, ...r, owner: ownsTitle(uid, t)}); } return out.sort((a, b) => b.at - a.at); }
const wishCounts = () => M("wishes", () => { const m = {}; for (const d of Object.values(docsOf("wishes"))) for (const k of Object.keys(d.w || {})) m[k] = (m[k] || 0) + 1; return m; });
const followCounts = () => M("follows", () => { const m = {}; for (const d of Object.values(docsOf("follows"))) for (const k of Object.keys(d.f || {})) m[k] = (m[k] || 0) + 1; return m; });
const activity = () => M("activity", () => { const since = Date.now() - 864e5, m = {}, byPost = {}; allPosts().forEach(p => { byPost[p.id] = p.tk; if (p.at > since) m[p.tk] = (m[p.tk] || 0) + 1; }); allComments().forEach(c => { const tk = byPost[c.postId]; if (tk && c.at > since) m[tk] = (m[tk] || 0) + 1; }); return m; });
const reportQueue = () => M("reports", () => { const m = {}; for (const [uid, d] of Object.entries(docsOf("reports"))) for (const [id, r] of Object.entries(d.r || {})) { if (LIVE.mod.hidden[id]) continue; const x = m[id] || (m[id] = {id, n: 0, reasons: {}}); x.n++; x.reasons[r.reason] = (x.reasons[r.reason] || 0) + 1; } return Object.values(m).sort((a, b) => b.n - a.n); });

  const cm = c => `<div class="cmt${c.parentId ? " reply" : ""}"><div class="meta">${who(c, t)} · ${ago(c.at)}${!c.parentId ? ` · <button class="lnk" data-act="reply" data-id="${c.id}">Reply</button>` : ""}${c.uid === LIVE.uid ? ` · <button class="lnk" data-act="delc" data-id="${c.id}">Delete</button>` : ""}</div>${esc(c.body)}</div>`;
  const reported = !!(mine("reports").r || {})[p.id];
  return `<div class="grid g12"><div class="c8">${panel(`<a href="#gallery-${esc(p.tk)}">${esc(p.tk)} gallery</a> ${isConcept(p) ? "· ★ concept" : ""}`, `<div class="pb post"><h2 class="h2">${esc(p.title)}</h2><div class="meta">${who(p, t)} · ${new Date(p.at).toLocaleString()} · ${cs.length} comments</div>
   <p style="margin:0;color:var(--text-2);max-width:65ch;white-space:pre-wrap">${esc(p.body)}</p>
   <div class="acts" style="justify-content:center"><button class="btn ${myV === 1 ? "" : "gh"}" data-act="vote" data-id="${p.id}" data-v="1" ${p.uid && p.uid === LIVE.uid ? "disabled title=\"You can't vote on your own post\"" : ""}>▲ ${v.up}</button><button class="btn ${myV === -1 ? "" : "gh"}" data-act="vote" data-id="${p.id}" data-v="-1" ${p.uid && p.uid === LIVE.uid ? "disabled" : ""}>▼ ${v.down}</button>
   ${p.uid === LIVE.uid ? `<button class="btn gh" data-act="delp" data-id="${p.id}">Delete</button>` : `<select id="rep-reason" class="sel" aria-label="Report reason"><option>Spam</option><option>Spoiler without warning</option><option>Harassment</option><option>Piracy link</option></select><button class="btn gh" data-act="report" data-id="${p.id}" ${reported ? "disabled" : ""}>${reported ? "Reported" : "Report"}</button>`}</div>
   ${myV ? `<p class="ip" style="text-align:center;margin:0">You voted ${myV > 0 ? "up" : "down"}. One vote per person, as on DCInside.</p>` : ""}</div>`)}</div>
   <div class="c4">${panel(`Comments <i>${cs.length}</i>`, `<div class="pb" style="padding-top:0">${tops.map(c => cm(c) + kids(c.id).map(cm).join("")).join("") || '<p class="sub">No comments yet.</p>'}<div style="margin-top:12px">${readOnlyNote()}${composer("c", `<div id="replyto" class="ip" hidden></div>`)}</div></div>`)}</div></div>`;
};

/* ---------- wishlist, profile, verify ---------- */
P.wishlist = () => {
  const w = wishCounts(), m = STATE.medium, myW = mine("wishes").w || {};
  const rows = titles.map(t => ({t, n: w[t.tk + "|" + m] || 0})).sort((a, b) => b.n - a.n || last(b.t) - last(a.t)).slice(0, 15);
  return `<div class="pagehead"><div><div class="eyebrow">Adaptation wishlist ${liveBadge()}</div><h1 class="h1">What should be adapted next?</h1><p class="sub">One vote per person, per title, per medium. Publishers and investors see these counts as a demand trend.</p></div><div class="tabs" id="mtabs">${MEDIA.map(x => `<button aria-pressed="${x === m}" data-m="${x}">${x[0].toUpperCase() + x.slice(1)}</button>`).join("")}</div></div>
  ${panel(`Most wished · ${m}`, `<div class="tw"><table><thead><tr><th class="r">#</th><th>Title</th><th>Status</th><th class="r">Wishes</th><th></th></tr></thead><tbody>${rows.map((r, i) => { const k = r.t.tk + "|" + m, on = !!myW[k]; return `<tr><td class="r mono fl">${i + 1}</td><td data-go="title-${r.t.tk}" style="cursor:pointer">${tname(r.t)}</td><td><span class="pill ${r.t.status === "Completed" ? "ok" : ""}">${r.t.status}</span></td><td class="r mono">${r.n}</td><td><button class="btn sm ${on ? "" : "gh"}" data-act="wish" data-k="${k}">${on ? "✓ Wished" : "✦ Wish"}</button></td></tr>`; }).join("")}</tbody></table></div>`)}`;
};
P.profile = () => {
  if (!LIVE.uid) return `<div class="pagehead"><div><div class="eyebrow">Your profile</div><h1 class="h1">Sign-in needed</h1>${readOnlyNote()}</div></div>`;
  const myPosts = allPosts().filter(p => p.uid === LIVE.uid), r = mine("ratings").r || {}, f = mine("follows").f || {}, cl = allClaims().filter(c => c.uid === LIVE.uid);
  return `<div class="pagehead"><div><div class="eyebrow">Your profile ${liveBadge()}</div><h1 class="h1"><span data-uid="${esc(LIVE.uid)}">…</span></h1><div class="meta" style="margin-top:6px">${Object.keys(r).length} ratings · ${myPosts.length} posts · following ${Object.keys(f).length}${cl.some(c => c.status === "approved") ? ' · <span class="vb">✓ VERIFIED</span>' : ""}</div></div></div>
  <div class="grid g12"><div class="c6">${panel("Following", Object.keys(f).length ? moverTable(Object.keys(f).filter(k => byTk[k]).map(k => byTk[k]), ["name", "px", "d7"]) : `<div class="pb"><p class="sub" style="margin:0">Follow titles from their title page.</p></div>`)}</div>
  <div class="c6">${panel("Your ratings", Object.keys(r).length ? `<div class="tw"><table><tbody>${Object.entries(r).filter(([k]) => byTk[k]).map(([k, x]) => `<tr data-go="title-${k}"><td>${tname(byTk[k])}</td><td class="r mono" style="color:var(--mark)">${x.score}/10</td></tr>`).join("")}</tbody></table></div>` : `<div class="pb"><p class="sub" style="margin:0">No ratings yet.</p></div>`)}</div>
  <div class="c6">${panel("Your posts", myPosts.length ? postTable(myPosts) : `<div class="pb"><p class="sub" style="margin:0">No posts yet.</p></div>`)}</div>
  <div class="c6">${panel("Your claims", cl.length ? claimTable(cl, false) : `<div class="pb"><p class="sub" style="margin:0">None. <a href="#verify" style="color:var(--mark)">Verify a title, author or publisher</a>.</p></div>`)}</div></div>`;
};
const AUTHORS = [...new Set(titles.map(t => t.author))].sort(), PUBS_L = [...new Set(titles.map(t => t.pub))].filter(p => p !== "Independent").sort();
P.verify = () => `<div class="pagehead"><div><div class="eyebrow">Verification ${liveBadge()}</div><h1 class="h1">Verify your claim</h1><p class="sub">In the product, you attach contracts or registration documents and a reviewer checks them. In this demo you submit the claim only, and the owner of this artifact approves or rejects it in the Claims queue. An approved author or publisher claim shows a verified badge in that title's gallery, and your ratings of those titles stop counting.</p></div></div>
  <div class="grid g12"><div class="c7">${panel("New claim", `<form id="claimform" class="pb" style="display:grid;gap:12px">${readOnlyNote()}
   <div class="field"><label for="cl-type">I am claiming</label><select id="cl-type" class="sel"><option value="author">An author (all their titles)</option><option value="publisher">A publisher (its slate)</option><option value="title">One title</option><option value="investor_entity">An investor entity (PE/VC, studio)</option></select></div>
   <div class="field"><label for="cl-ref">Entity</label><select id="cl-ref" class="sel">${AUTHORS.map(a => `<option>${esc(a)}</option>`).join("")}</select><input id="cl-firm" class="in" placeholder="Firm name" hidden maxlength="120"></div>
   <div class="field"><label for="cl-role">Your role</label><input id="cl-role" class="in" maxlength="80" placeholder="e.g. Head of licensing"></div>
   <div class="drop"><b style="color:var(--text)">Documents</b><span>Not collected in this demo. The product accepts PDF, PNG or JPEG, reviewed by staff only.</span></div>
   <div class="acts" style="justify-content:flex-end"><button class="btn" type="submit">Submit for review</button></div></form>`)}</div>
  <div class="c5">${panel("Your claims", allClaims().filter(c => c.uid === LIVE.uid).length ? claimTable(allClaims().filter(c => c.uid === LIVE.uid), false) : `<div class="pb"><p class="sub" style="margin:0">None yet.</p></div>`)}</div></div>`;
function claimTable(list, admin) {
  return `<div class="tw"><table><thead><tr><th>When</th>${admin ? "<th>Who</th>" : ""}<th>Type</th><th>Entity</th><th>Status</th>${admin ? "<th></th>" : ""}</tr></thead><tbody>${list.map(c => `<tr style="cursor:default"><td class="mono fl">${ago(c.at)}</td>${admin ? `<td><span class="nick" data-uid="${esc(c.uid)}">…</span>${c.role ? `<br><span class="ip">${esc(c.role)}</span>` : ""}</td>` : ""}<td><span class="pill ${c.type === "investor_entity" ? "mk" : ""}">${c.type.replace("_entity", "")}</span></td><td style="font-weight:600;white-space:normal">${esc(c.ref)}</td><td><span class="pill ${c.status === "approved" ? "ok" : c.status === "rejected" ? "up" : "warn"}">${c.status}</span></td>${admin ? `<td>${c.status === "pending" ? `<div class="acts"><button class="btn sm" data-act="approve" data-id="${c.id}">Approve</button><button class="btn gh sm" data-act="reject" data-id="${c.id}">Reject</button></div>` : c.status === "approved" ? `<button class="btn gh sm" data-act="revoke" data-id="${c.id}">Revoke</button>` : ""}</td>` : ""}</tr>`).join("")}</tbody></table></div>`;
}

/* ---------- owner-only queues ---------- */
function ownerOnly() { return `<div class="pagehead"><div><h1 class="h1">Owner only</h1><p class="sub">Only the owner of this artifact (and its Editors) can review claims and moderate.</p></div></div>`; }
P.claims = () => {
  if (!LIVE.admin) return ownerOnly();
  const tabs = ["pending", "approved", "rejected"], l = allClaims().filter(c => c.status === STATE.claimTab);
  return `<div class="pagehead"><div><div class="eyebrow">Owner ${liveBadge()}</div><h1 class="h1">Claim review</h1></div><div class="tabs" id="ctabs">${tabs.map(x => `<button aria-pressed="${x === STATE.claimTab}" data-c="${x}">${x[0].toUpperCase() + x.slice(1)} ${allClaims().filter(c => c.status === x).length}</button>`).join("")}</div></div>
  ${panel("Queue", l.length ? claimTable(l, true) : `<div class="pb"><p class="sub" style="margin:0">Nothing here.</p></div>`)}`;
};
P.moderation = () => {
  if (!LIVE.admin) return ownerOnly();
  const q = reportQueue(), byId = {}; allPosts().forEach(p => byId[p.id] = p); allComments().forEach(c => byId[c.id] = c);
  const hiddenN = Object.keys(LIVE.mod.hidden).length;
  return `<div class="pagehead"><div><div class="eyebrow">Owner ${liveBadge()}</div><h1 class="h1">Moderation</h1><p class="sub">${hiddenN} item${hiddenN === 1 ? "" : "s"} hidden so far. Hiding removes a post or comment for everyone.</p></div></div>
  ${panel("Reports", q.length ? `<div class="tw"><table><thead><tr><th>Target</th><th>Reasons</th><th class="r">Reports</th><th>Writer</th><th></th></tr></thead><tbody>${q.map(r => { const x = byId[r.id]; return `<tr style="cursor:default"><td style="white-space:normal;font-weight:600">${x ? esc(x.title || x.body.slice(0, 80)) : '<span class="fl">(deleted)</span>'}</td><td>${Object.entries(r.reasons).map(([k, n]) => `<span class="pill">${esc(k)} ×${n}</span>`).join(" ")}</td><td class="r mono">${r.n}</td><td>${x ? who(x, byTk[x.tk]) : ""}</td><td><button class="btn sm" data-act="hide" data-id="${r.id}">Hide</button></td></tr>`; }).join("")}</tbody></table></div>` : `<div class="pb"><p class="sub" style="margin:0">No open reports.</p></div>`)}`;
};

/* ---------- routing (replaces the prototype's) ---------- */
navFor = function () {
  const p = STATE.persona, show = r => r[2] === "m" || r[2] === "c" || r[2] === "h2" || (r[2] === "p") || (r[2] === "a" && LIVE.admin);
  $("nav").innerHTML = ROUTES.filter(show).map(r => `<a href="#${r[0]}" class="${r[2] === "p" ? "pro" : ""}" ${STATE.route === r[0] ? 'aria-current="page"' : ""}>${r[2] === "p" && !isPro() && r[0] !== "plans" ? "🔒 " : ""}${r[1]}</a>`).join("");
};
function renderView() {
  let h = location.hash.slice(1) || "market"; STATE.arg = null;
  const m = h.match(/^(title|gallery|post)-(.+)$/); if (m) { h = m[1]; STATE.arg = m[2]; }
  if (!P[h] && h !== "title") h = "market";
  STATE.route = h;
  $("view").innerHTML = (h === "title" ? titlePage(STATE.arg || titles[0].tk) : P[h]()) + `<div class="foot"><span>PLOTLINE · LIVE DEMO</span><span><span class="sample">MARKET NUMBERS ARE SAMPLE DATA</span> · community data is ${LIVE.status === "live" ? "live and shared" : "not connected"}</span><span>PREVIEWING AS ${STATE.persona.toUpperCase()}</span></div>`;
  navFor(); spec(); mount(); wireLive(); fillNames();
}
route = function () {
  renderView(); window.scrollTo(0, 0);
};

/* ---------- event wiring for live controls ---------- */
function wireLive() {
  const v = $("view");
  v.querySelectorAll("[data-act]").forEach(b => b.onclick = e => { e.preventDefault(); e.stopPropagation(); act(b.dataset.act, b); });
  const gt = $("gtabs"); if (gt) gt.querySelectorAll("button").forEach(b => b.onclick = () => { STATE.tab = b.dataset.tab; rerender(); });
  const mt = $("mtabs"); if (mt) mt.querySelectorAll("button").forEach(b => b.onclick = () => { STATE.medium = b.dataset.m; rerender(); });
  const ct = $("ctabs"); if (ct) ct.querySelectorAll("button").forEach(b => b.onclick = () => { STATE.claimTab = b.dataset.c; rerender(); });
  v.querySelectorAll(".rateform").forEach(f => {
    let score = +((f.querySelector(".sc.on") || {}).dataset || {}).score || null;
    f.querySelectorAll(".sc").forEach(b => b.onclick = () => { score = +b.dataset.score; f.querySelectorAll(".sc").forEach(x => x.classList.toggle("on", x === b)); });
    f.onsubmit = async e => { e.preventDefault(); if (!score) { toast("Pick a score from 1 to 10."); return; }
      const tk = f.dataset.tk, review = f.querySelector("textarea").value.trim().slice(0, 600);
      if (await saveMine("ratings", d => { d.r = d.r || {}; d.r[tk] = {score, review, at: Date.now()}; return d; })) toast("Rating saved"); };
  });
  const pf = $("postform");
  if (pf) pf.onsubmit = async e => { e.preventDefault();
    const title = $("post-title").value.trim(), body = $("post-body").value.trim(), anon = $("post-anon").checked, nick = ($("post-nick").value.trim() || "ㅇㅇ").slice(0, 20);
    if (!title || !body) return;
    const id = rid();
    if (await saveMine("posts", d => { d.items = [...(d.items || []), {id, tk: STATE.arg, title: title.slice(0, 120), body: body.slice(0, 4000), anon, nick: anon ? nick : null, at: Date.now()}].slice(-200); return d; })) { location.hash = "post-" + id; toast("Posted"); } };
  const cf = $("cform");
  if (cf) cf.onsubmit = async e => { e.preventDefault();
    const body = $("c-body").value.trim(), anon = $("c-anon").checked, nick = ($("c-nick").value.trim() || "ㅇㅇ").slice(0, 20), parentId = cf.dataset.parent || null;
    if (!body) return;
    if (await saveMine("comments", d => { d.items = [...(d.items || []), {id: rid(), postId: STATE.arg, parentId, body: body.slice(0, 2000), anon, nick: anon ? nick : null, at: Date.now()}].slice(-500); return d; })) { $("c-body").value = ""; delete cf.dataset.parent; rerender(); } };
  const clf = $("claimform");
  if (clf) {
    const type = $("cl-type"), ref = $("cl-ref"), firm = $("cl-firm");
    const opts = () => { const t = type.value; firm.hidden = t !== "investor_entity"; ref.hidden = t === "investor_entity";
      const l = t === "author" ? AUTHORS : t === "publisher" ? PUBS_L : t === "title" ? titles.map(x => x.tk + " · " + x.name) : [];
      ref.innerHTML = l.map(x => `<option>${esc(x)}</option>`).join(""); };
    type.onchange = opts;
    clf.onsubmit = async e => { e.preventDefault();
      const t = type.value, r = t === "investor_entity" ? firm.value.trim() : t === "title" ? ref.value.split(" · ")[0] : ref.value;
      if (!r) { toast("Name the entity you are claiming."); return; }
      if (allClaims().some(c => c.uid === LIVE.uid && c.type === t && c.ref === r && c.status !== "rejected")) { toast("You already have a claim for this."); return; }
      if (await saveMine("claims", d => { d.items = [...(d.items || []), {id: rid(), type: t, ref: r.slice(0, 120), role: $("cl-role").value.trim().slice(0, 80), at: Date.now()}]; return d; })) toast("Claim submitted for review"); };
  }
}
async function act(a, b) {
  const id = b.dataset.id;
  if (a === "goto") { const el = document.getElementById(id); if (el) el.scrollIntoView({behavior: "smooth", block: "center"}); return; }
  if (a === "follow") { const tk = b.dataset.tk; await saveMine("follows", d => { d.f = d.f || {}; if (d.f[tk]) delete d.f[tk]; else d.f[tk] = Date.now(); return d; }); }
  else if (a === "wish") { const k = b.dataset.k; await saveMine("wishes", d => { d.w = d.w || {}; if (d.w[k]) delete d.w[k]; else d.w[k] = Date.now(); return d; }); }
  else if (a === "vote") { const val = +b.dataset.v; const cur = (mine("votes").v || {})[id];
    if (cur) { toast("You already voted on this post."); return; }
    await saveMine("votes", d => { d.v = d.v || {}; d.v[id] = val; return d; }); }
  else if (a === "report") { const reason = ($("rep-reason") || {}).value || "Spam"; if (await saveMine("reports", d => { d.r = d.r || {}; d.r[id] = {reason, at: Date.now()}; return d; })) toast("Reported to the moderators"); }
  else if (a === "delp") { if (await saveMine("posts", d => { d.items = (d.items || []).filter(p => p.id !== id); return d; })) location.hash = "gallery"; }
  else if (a === "delc") { await saveMine("comments", d => { d.items = (d.items || []).filter(c => c.id !== id); return d; }); }
  else if (a === "reply") { const cf = $("cform"); if (cf) { cf.dataset.parent = id; const r = $("replyto"); r.hidden = false; r.textContent = "Replying to a comment. Clear the box to cancel."; $("c-body").focus(); } }
  else if (a === "approve" || a === "reject" || a === "revoke") {
    const c = allClaims().find(x => x.id === id); if (!c) return;
    await saveMod(m => { delete m.approved[id]; delete m.rejected[id];
      if (a === "approve") m.approved[id] = {uid: c.uid, type: c.type, ref: c.ref, at: Date.now()};
      if (a === "reject") m.rejected[id] = {at: Date.now()};
      return m; });
    toast(a === "approve" ? "Approved. The verified badge is live." : a === "reject" ? "Rejected" : "Revoked");
  }
  else if (a === "hide") { if (await saveMod(m => { m.hidden[id] = Date.now(); return m; })) toast("Hidden for everyone"); }
}

/* ---------- start ---------- */
$("persona").onchange = e => { STATE.persona = e.target.value; rerender(); };
$("cvKR").onclick = () => conv(false); $("cvUS").onclick = () => conv(true);
$("specBtn").onclick = () => toggleSpec(!STATE.spec);
document.addEventListener("keydown", e => { if (e.key === "Escape") toggleSpec(false); });
window.addEventListener("hashchange", route);
try { if (localStorage.getItem("plt-conv") === "us") document.documentElement.classList.add("us"), $("cvUS").setAttribute("aria-pressed", "true"), $("cvKR").setAttribute("aria-pressed", "false"); } catch (e) {}
tape(); renderView();

</script>
