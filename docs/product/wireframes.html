<title>Plotline Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --sunk:#E9ECF0; --ink:#1C2129; --muted:#646C78; --line:#C8CDD5; --line-2:#DDE1E7;
  --link:#2D5B86; --link-bg:#E3ECF5; --prem:#9A5F12; --prem-bg:#F6EBDC; --ok:#2F6B45; --ok-bg:#E1EFE6; --bad:#9B3131; --bad-bg:#F5E2E2;
  --hatch:repeating-linear-gradient(135deg,#D9DDE3 0 1px,transparent 1px 7px);
  --display:"Archivo","Arial Narrow",system-ui,sans-serif; --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#14171C; --surface:#1C2027; --sunk:#232830; --ink:#E3E6EA; --muted:#98A0AB; --line:#39414C; --line-2:#2C323B;
  --link:#86AED6; --link-bg:#1F2F40; --prem:#DDA35A; --prem-bg:#3A2C18; --ok:#7DC096; --ok-bg:#1B3024; --bad:#E08C8C; --bad-bg:#3A1F1F;
  --hatch:repeating-linear-gradient(135deg,#2E343D 0 1px,transparent 1px 7px);}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#14171C; --surface:#1C2027; --sunk:#232830; --ink:#E3E6EA; --muted:#98A0AB; --line:#39414C; --line-2:#2C323B;
  --link:#86AED6; --link-bg:#1F2F40; --prem:#DDA35A; --prem-bg:#3A2C18; --ok:#7DC096; --ok-bg:#1B3024; --bad:#E08C8C; --bad-bg:#3A1F1F;
  --hatch:repeating-linear-gradient(135deg,#2E343D 0 1px,transparent 1px 7px);}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);margin:0}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
/* rail */
.rail{border-right:1px solid var(--line);padding:20px 16px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;background:var(--surface)}
.brand{font:800 20px/1 var(--display);letter-spacing:-.01em}
.brand small{display:block;font:500 11px/1.4 var(--mono);color:var(--muted);letter-spacing:.04em;margin-top:6px;text-transform:uppercase}
.grp{margin-top:18px}
.grp h3{font:600 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.grp a{display:flex;gap:8px;align-items:baseline;text-decoration:none;color:var(--ink);padding:5px 8px;border-radius:4px;font-size:13px}
.grp a span{font:500 11px var(--mono);color:var(--muted);min-width:24px}
.grp a:hover{background:var(--sunk)}
.grp a[aria-current="true"]{background:var(--link-bg);color:var(--link)}
.grp a[aria-current="true"] span{color:var(--link)}
.legend{margin-top:20px;font-size:12px;color:var(--muted);display:grid;gap:6px}
/* main */
main{padding-block:24px 64px;padding-inline:28px;min-width:0}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:16px}
.eyebrow{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:800 28px/1.1 var(--display);margin:4px 0 0;letter-spacing:-.015em;text-wrap:balance}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{font:500 12px var(--sans);border:0;background:transparent;color:var(--ink);padding:6px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
/* frame */
.frame{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-inline:auto;width:100%;transition:max-width .2s}
.frame.phone{max-width:390px}
.bar{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font:800 15px var(--display)}
.search{flex:1;min-width:120px;height:28px;border:1px solid var(--line);border-radius:4px;background:var(--sunk);font-size:12px;color:var(--muted);display:flex;align-items:center;padding:0 8px}
.nav{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.frame.phone .nav{display:none}
.body{padding:16px;display:grid;gap:14px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 200px;min-width:0}
.row.tiles>*{flex:1 1 120px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.frame.phone .row>*{flex-basis:100%}
.box{border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;gap:8px;align-content:start;min-width:0}
.box h4{margin:0;font:700 13px var(--display);letter-spacing:.01em;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.box h4 small{font:400 11px var(--mono);color:var(--muted)}
.ph{background:var(--hatch),var(--sunk);border:1px dashed var(--line);border-radius:4px;display:grid;place-items:center;color:var(--muted);font:500 11px var(--mono);text-align:center;padding:6px}
.cover{aspect-ratio:3/4;max-width:100%}
.line{height:8px;border-radius:2px;background:var(--line-2)}
.w60{width:60%}.w80{width:80%}.w40{width:40%}
.num{font:700 22px var(--display);font-variant-numeric:tabular-nums}
.lbl{font:500 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.chip{display:inline-flex;gap:4px;align-items:center;font:500 11px var(--mono);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.chip.ok{border-color:transparent;background:var(--ok-bg);color:var(--ok)}
.chip.bad{border-color:transparent;background:var(--bad-bg);color:var(--bad)}
.chip.prem{border-color:transparent;background:var(--prem-bg);color:var(--prem)}
.chip.link{border-color:transparent;background:var(--link-bg);color:var(--link)}
.btn{font:600 12px var(--sans);border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:4px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.prem{background:var(--prem);border-color:var(--prem);color:var(--surface)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
th{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;border-bottom:1px solid var(--line);padding:6px}
td{border-bottom:1px solid var(--line-2);padding:6px;white-space:nowrap}
td.t{white-space:normal;min-width:160px}
td.r,th.r{text-align:right}
tr.concept td{background:var(--link-bg)}
.ip{color:var(--muted);font:400 11px var(--mono)}
.badge{font:600 10px var(--mono);color:var(--ok);background:var(--ok-bg);border-radius:3px;padding:0 4px}
.lock{position:relative;border:1px dashed var(--prem);border-radius:6px;padding:12px;overflow:hidden;min-height:120px}
.lock .blur{filter:blur(3px);opacity:.55;display:grid;gap:8px;pointer-events:none}
.lock .over{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:6px;text-align:center;padding:12px;background:color-mix(in srgb,var(--surface) 55%,transparent)}
.lock .over b{font:700 13px var(--display);color:var(--prem)}
.lock .over p{margin:0;font-size:12px;color:var(--muted);max-width:32ch}
.bars{display:grid;gap:4px}
.bars div{display:grid;grid-template-columns:22px 1fr 36px;gap:6px;align-items:center;font:400 11px var(--mono);color:var(--muted)}
.bars i{display:block;height:8px;background:var(--ink);opacity:.6;border-radius:2px}
.band{position:relative;height:28px;border-radius:4px;background:var(--sunk);margin-top:6px}
.band .rng{position:absolute;top:6px;bottom:6px;background:var(--prem-bg);border:1px solid var(--prem);border-radius:3px}
.band .mid{position:absolute;top:2px;bottom:2px;width:2px;background:var(--prem)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font:500 11px var(--mono);padding:4px 8px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.steps span.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.steps span.done{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.field{display:grid;gap:4px}
.field label{font:500 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.input{height:30px;border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:0 8px;display:flex;align-items:center;font-size:12px;color:var(--muted)}
.input.area{height:80px;align-items:flex-start;padding-top:6px}
.cmt{border-left:2px solid var(--line);padding-left:10px;display:grid;gap:2px;font-size:12.5px}
.cmt.reply{margin-left:18px}
.meta{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spark{width:100%;height:44px;display:block}
.spark path.l{fill:none;stroke:var(--ink);stroke-width:1.5}
.spark path.a{fill:var(--sunk)}
.spark path.p{fill:none;stroke:var(--prem);stroke-width:1.5;stroke-dasharray:3 3}
/* annotations */
.notes{display:grid;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.note{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:10px}
.note h5{margin:0;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.note p{margin:0;font-size:13px}
.note ul{margin:0;padding-left:16px;display:grid;gap:4px;font-size:13px}
.kpi{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;border-bottom:1px solid var(--line-2);padding-bottom:4px}
.kpi code{font:400 11px var(--mono);color:var(--muted)}
.mods{display:flex;gap:4px;flex-wrap:wrap}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
.sample{font:500 11px var(--mono);color:var(--prem)}
@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}.notes{position:static}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .grp-list{display:none}
  main{padding-inline:16px}
}
.mobile-pick{display:none;margin-top:12px}
.mobile-pick select{width:100%;height:34px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);font:13px var(--sans)}
@media (max-width:760px){.mobile-pick{display:block}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand">Plotline<small>Wireframes · Phase 1 · low fidelity</small></div>
    <div class="mobile-pick"><label class="lbl" for="pick">Screen</label><select id="pick"></select></div>
    <div class="grp-list" id="rail"></div>
    <div class="legend">
      <div><span class="chip">✔</span> shown to fans</div>
      <div><span class="chip prem">🔒</span> premium (verified + paid)</div>
      <div><span class="chip link">new</span> fan signal created on Plotline</div>
      <div class="sample">All titles, names and numbers are sample data.</div>
    </div>
  </aside>
  <main>
    <div class="head">
      <div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1></div>
      <div class="ctrls">
        <div class="seg" role="group" aria-label="Frame width">
          <button type="button" id="wDesk" aria-pressed="true">Desktop</button>
          <button type="button" id="wPhone" aria-pressed="false">Phone</button>
        </div>
      </div>
    </div>
    <div class="layout">
      <div><div class="frame" id="frame"></div>
        <div class="pager"><button type="button" class="btn ghost" id="prev">← Previous</button><button type="button" class="btn ghost" id="next">Next →</button></div>
      </div>
      <div class="notes" id="notes"></div>
    </div>
  </main>
</div>

<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bar=(active)=>`<div class="bar"><span class="logo">Plotline</span><div class="search">Search titles, authors, galleries…</div>
<nav class="nav"><span${active==='home'?' style="color:var(--ink);font-weight:600"':''}>Home</span><span>Charts</span><span>Galleries</span><span>Wishlist</span><span>For creators & business</span></nav>
<span class="chip">Sign in</span></div>`;
const barPro=(who)=>`<div class="bar"><span class="logo">Plotline <span class="chip prem">${who}</span></span><div class="search">Search any title, author, publisher…</div>
<nav class="nav"><span>Dashboard</span><span>Compare</span><span>Scouting</span><span>Market</span><span>Alerts</span></nav><span class="chip ok">✓ Verified</span></div>`;
const barAdmin=`<div class="bar"><span class="logo">Plotline <span class="chip bad">Admin</span></span><nav class="nav"><span>Claims</span><span>Moderation</span><span>Galleries</span><span>Config</span></nav></div>`;
const lines=(n)=>Array.from({length:n},(_,i)=>`<div class="line ${['w80','w60','','w40'][i%4]}"></div>`).join('');
function spark(pts,cls='l',h=44){const w=200,mx=Math.max(...pts),mn=Math.min(...pts),sx=w/(pts.length-1),y=v=>h-4-((v-mn)/((mx-mn)||1))*(h-8);
  const d=pts.map((v,i)=>`${i?'L':'M'}${(i*sx).toFixed(1)},${y(v).toFixed(1)}`).join('');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">${cls==='l'?`<path class="a" d="${d}L${w},${h}L0,${h}Z"/>`:''}<path class="${cls}" d="${d}"/></svg>`;}
const hist=(v)=>`<div class="bars">${v.map((x,i)=>`<div><span>${10-i}</span><i style="width:${x}%"></i><span>${x}%</span></div>`).join('')}</div>`;
const lock=(title,body,cta='Verify to unlock')=>`<div class="lock"><div class="blur">${body}</div><div class="over"><b>🔒 ${title}</b><p>Available to verified authors, publishers and IP investors.</p><span class="btn prem">${cta}</span></div></div>`;
const kp=(n,l,extra='')=>`<div class="box"><span class="lbl">${l}</span><span class="num">${n}</span>${extra}</div>`;

const S=[
/* ---------------- FAN ---------------- */
{g:'Fan · free',id:'home',t:'Home feed',
 f:()=>`${bar('home')}<div class="body">
 <div class="row"><div class="box"><h4>New episodes from what you follow <small>today</small></h4>
  ${['Tower of Ash · Ep 142 · 318 comments','The Salt Archivist · Ch 57 · 94 comments','Nine Lanterns · Ep 23 · 41 comments'].map(x=>`<div class="meta" style="justify-content:space-between"><span style="color:var(--ink)">${x}</span><span class="chip">Episode thread →</span></div>`).join('')}</div>
 <div class="box"><h4>Rising this week <small>rank Δ 7d</small></h4>
  ${[['Nine Lanterns','▲ 41'],['Glass Orchard','▲ 33'],['Red Ledger','▲ 27']].map(([a,b])=>`<div class="meta" style="justify-content:space-between"><span style="color:var(--ink)">${a}</span><span class="chip ok">${b}</span></div>`).join('')}
  <div class="meta"><span class="chip link">new</span> Followed early? You earn scout points.</div></div></div>
 <div class="box"><h4>Concept posts across galleries <small>promoted by fan upvotes</small></h4>
  <div class="tw"><table><tr><th>Gallery</th><th>Post</th><th>By</th><th class="r">Up</th></tr>
  <tr><td>Tower of Ash</td><td class="t">Theory: the ash tower is the author's earlier novel's world</td><td>ㅇㅇ <span class="ip">(118.235)</span></td><td class="r">412</td></tr>
  <tr><td>Romance Fantasy</td><td class="t">Every regression-villainess title ranked by pacing</td><td>lanternkeeper</td><td class="r">288</td></tr>
  <tr><td>Glass Orchard</td><td class="t">Author notice: hiatus ends 3 Oct <span class="badge">✓ AUTHOR</span></td><td>M. Arden</td><td class="r">203</td></tr></table></div></div>
 <div class="row"><div class="box"><h4>Adaptation wishlist <small>this week</small></h4>${lines(3)}<span class="btn ghost">Vote →</span></div>
 <div class="box"><h4>Top fan-rated <small>weighted, ≥ 20 votes</small></h4>${lines(3)}</div></div></div>`,
 n:{purpose:'Daily return surface. It combines what the fan follows (new episodes), what is moving (Rising), and what the community endorses (concept posts).',
  loop:'Episode threads and concept posts make up the daily habit. The Rising list tells fans what scout points are for.',
  kpis:[['PlotScore / rank Δ','✔','plotscore.py, fact_score'],['Rising badge','✔','trends_engine.py'],['Concept posts','new','community'],['Fan rating (weighted)','new','fan']],
  mods:['market','community','fan']}},

{g:'Fan · free',id:'charts',t:'Charts',
 f:()=>`${bar()}<div class="body">
 <div class="row"><div class="seg"><button aria-pressed="true">Trending</button><button>Rising</button><button>Fan-rated</button><button>Most wished</button></div>
 <div class="seg"><button aria-pressed="true">All</button><button>Comics</button><button>Novels</button></div></div>
 <div class="tw"><table><tr><th>#</th><th>Title</th><th>Platform</th><th class="r">PlotScore</th><th class="r">Fan ★</th><th class="r">Views</th><th>Cadence</th><th>7d</th></tr>
 ${[['1','Tower of Ash','Webtoon','94','8.7','1.2B','1 / wk','—'],['2','The Salt Archivist','Royal Road','91','9.1','48M','3 / wk','▲2'],['3','Nine Lanterns','Tapas','88','8.2','120M','1 / wk','▲41'],['4','Red Ledger','Webnovel','86','7.9','310M','7 / wk','▲27'],['5','Glass Orchard','Tappytoon','84','8.9','64M','hiatus','▼3']].map(r=>`<tr><td>${r[0]}</td><td class="t">${r[1]}</td><td>${r[2]}</td><td class="r"><b>${r[3]}</b></td><td class="r">${r[4]}</td><td class="r">${r[5]}</td><td>${r[6]}</td><td>${r[7].startsWith('▲')?`<span class="chip ok">${r[7]}</span>`:r[7].startsWith('▼')?`<span class="chip bad">${r[7]}</span>`:r[7]}</td></tr>`).join('')}
 </table></div>
 <div class="meta">Views are rounded for fans. Exact series and revenue are premium.</div></div>`,
 n:{purpose:'IMDb-style charts. The four tabs map to four signal types: market (Trending), momentum (Rising), community quality (Fan-rated) and demand (Most wished).',
  loop:'"Most wished" makes the wishlist visible, and that visibility drives more votes.',
  kpis:[['PlotScore','✔','plotscore.py'],['Views (rounded)','✔','fact_title_daily'],['Cadence','✔','episode_analytics.py:57'],['Wishlist votes','new','fan'],['Revenue','🔒 hidden','earnings.py']],
  mods:['market','fan','kpi']}},

{g:'Fan · free',id:'title',t:'Title page',
 f:()=>`${bar()}<div class="body">
 <div class="row"><div class="ph cover" style="flex:0 1 150px">cover</div>
 <div style="flex:3 1 260px;display:grid;gap:8px;align-content:start">
  <div class="eyebrow">Web comic · Fantasy › Dark fantasy · Ongoing</div>
  <div style="font:800 24px/1.1 var(--display)">Tower of Ash</div>
  <div class="meta">by <a href="#credits">H. Seo</a> (story) · <a href="#credits">K. Lim</a> (art) · Publisher: <a href="#credits">Studio Nara</a></div>
  <div class="row tiles" style="gap:8px">
   ${kp('94','PlotScore','<span class="meta">rank #1 · <span class="chip ok">Rising</span></span>')}
   ${kp('8.7','Fan rating','<span class="meta">12,480 votes · <a href="#title">rate</a></span>')}
   ${kp('9.4','Platform rating','<span class="meta">Webtoon</span>')}</div>
  <div class="meta"><span class="chip">Where to read:</span><span class="chip">Webtoon EN</span><span class="chip">Naver KR</span><span class="chip">Ridi (novel)</span><span class="chip">3 platforms</span></div>
  <div class="acts"><span class="btn">+ Follow</span><span class="btn ghost">Add to list</span><span class="btn ghost">Wish adaptation</span></div>
 </div></div>
 <div class="row"><div class="box"><h4>Rounded stats</h4><div class="meta">1.2B views · 4.1M subscribers · 1 ep / wk · 142 episodes · style: Dark & moody</div></div>
 <div class="box"><h4>Fan rating distribution</h4>${hist([38,24,14,9,6,4,2,1,1,1])}</div></div>
 <div class="row"><div class="box"><h4>Gallery <small>2,314 posts · 18 concept</small></h4>
  <div class="meta" style="color:var(--ink)">Theory: the ash tower is the author's earlier novel's world</div><div class="meta" style="color:var(--ink)">Ep 142 thread: that last panel <span class="chip">318</span></div><a href="#gallery">Open gallery →</a></div>
 <div class="box"><h4>Reviews <small>top by helpful</small></h4>${lines(4)}</div></div>
 <div class="row">
  ${lock('Performance & value',`<div class="row">${kp('$41k–$256k','Modeled revenue / mo')}${kp('$—','Valuation band')}</div>${spark([3,4,4,6,7,9,12,14,13,16,19,22])}`)}
  ${lock('Competitor benchmarks',`<table><tr><th>Component</th><th>Pct</th></tr><tr><td>Reach</td><td>99</td></tr><tr><td>Momentum</td><td>87</td></tr><tr><td>Engagement</td><td>91</td></tr></table>`)}
 </div></div>`,

const $=id=>document.getElementById(id);
const rail=$('rail'),pick=$('pick');let cur=0;
const groups=[...new Set(S.map(s=>s.g))];
rail.innerHTML=groups.map(g=>`<div class="grp"><h3>${g}</h3>${S.map((s,i)=>s.g===g?`<a href="#${s.id}" data-i="${i}"><span>S${i+1}</span>${esc(s.t)}</a>`:'').join('')}</div>`).join('');
pick.innerHTML=S.map((s,i)=>`<option value="${s.id}">S${i+1} · ${esc(s.t)}</option>`).join('');
function render(i){
  cur=(i+S.length)%S.length;const s=S[cur];
  $('eyebrow').textContent=`S${cur+1} of ${S.length} · ${s.g}`;$('title').textContent=s.t;
  $('frame').innerHTML=s.f();
  const n=s.n;
  $('notes').innerHTML=`<div class="note"><h5>Purpose</h5><p>${n.purpose}</p></div>
  <div class="note"><h5>Flywheel role</h5><p>${n.loop}</p></div>
  ${n.kpis.length?`<div class="note"><h5>KPIs on this screen</h5>${n.kpis.map(k=>`<div class="kpi"><span>${k[0]} <span class="chip ${k[1].startsWith('🔒')?'prem':k[1]==='new'?'link':''}">${k[1]}</span></span><code>${k[2]}</code></div>`).join('')}</div>`:''}
  <div class="note"><h5>Modules</h5><div class="mods">${n.mods.map(m=>`<span class="chip">${m}</span>`).join('')}</div></div>`;
  rail.querySelectorAll('a').forEach(a=>a.setAttribute('aria-current',String(+a.dataset.i===cur)));
  pick.value=s.id;
}
function fromHash(){const h=location.hash.slice(1);const i=S.findIndex(s=>s.id===h);render(i<0?0:i);}
window.addEventListener('hashchange',fromHash);
pick.addEventListener('change',()=>{location.hash=pick.value;});
$('prev').onclick=()=>{location.hash=S[(cur-1+S.length)%S.length].id;};
$('next').onclick=()=>{location.hash=S[(cur+1)%S.length].id;};
function setW(phone){$('frame').classList.toggle('phone',phone);$('wPhone').setAttribute('aria-pressed',phone);$('wDesk').setAttribute('aria-pressed',!phone);try{localStorage.setItem('wf-phone',phone?'1':'0')}catch(e){}}
$('wDesk').onclick=()=>setW(false);$('wPhone').onclick=()=>setW(true);
fromHash();
try{if(localStorage.getItem('wf-phone')==='1')setW(true)}catch(e){}
</script>
