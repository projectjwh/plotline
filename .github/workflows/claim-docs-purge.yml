name: claim-docs-purge

# D-040: delete claim documents 90 days after the decision (the claim record is kept).
# Runs against production with the same secrets as the app. Safe to re-run.
on:
  schedule:
    - cron: "17 4 * * *"      # daily, 04:17 UTC
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    env:
      PLOTLINE_ENV: prod
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PLOTLINE_JWT_SECRET: ${{ secrets.PLOTLINE_JWT_SECRET }}
      PLOTLINE_IP_SALT: ${{ secrets.PLOTLINE_IP_SALT }}
      PLOTLINE_EMAIL_SENDER: resend
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      PLOTLINE_BLOB_STORE: r2
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_APP_BUCKET: ${{ secrets.R2_APP_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-app.txt
      - name: Purge
        if: ${{ env.DATABASE_URL != '' }}
        run: python -m src.app.cli purge-claim-docs
