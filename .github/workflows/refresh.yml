# Scheduled data refresh: crawl → medallion pipeline → warehouse → publish to R2.
# The read API (Fly.io) downloads the published plotline.duckdb on boot, so this
# workflow is what makes new data go live — no redeploy needed.
#
# Reliability note: scraping from GitHub's datacenter IPs is best-effort and some
# platforms may block it. run_pipeline continues past a failed scrape (no
# --strict) and still rebuilds the warehouse from whatever Bronze exists. For a
# guaranteed heavy refresh, run locally (Windows Task Scheduler) and let
# publish_warehouse.py push the artifact — see DEPLOYMENT.md.
name: refresh

on:
  schedule:
    - cron: "17 6 * * *"          # daily 06:17 UTC — light refresh (rankings)
  workflow_dispatch:
    inputs:
      enrich:
        description: "Detail pages to enrich (0 = light/rankings-only)"
        default: "0"

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_KEY: ${{ secrets.R2_KEY }}
      R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install refresh deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-refresh.txt
          python -m playwright install chromium

      - name: Refresh (scrape → pipeline → warehouse)
        run: |
          python -m src.scrapers.listing_fetch --source royalroad || true
          N="${{ github.event.inputs.enrich || '0' }}"
          if [ "$N" != "0" ]; then
            python run_pipeline.py --scrape --enrich "$N" || true
          else
            python run_pipeline.py --scrape || true
          fi
          python -m src.scrapers.cover_crawler --all || true
          python -m src.db.warehouse

      - name: Build API-backed explorer (shell + data JSON)
        run: |
          if [ -n "${{ secrets.R2_PUBLIC_BASE }}" ]; then
            python -m src.reports.build_explorer --mode api \
              --data-url "${{ secrets.R2_PUBLIC_BASE }}/${{ secrets.R2_EXPLORER_KEY || 'explorer_data.json' }}" \
              --out web/index.html
          else
            python -m src.reports.build_explorer --out web/index.html   # self-contained fallback
          fi

      - name: Publish artifacts → R2
        env:
          PLOTLINE_EXPLORER_JSON: web/explorer_data.json
        run: python -m src.db.publish_warehouse

      - name: Upload build artifacts (warehouse + web shell)
        uses: actions/upload-artifact@v4
        with:
          name: plotline-build
          path: |
            data/plotline.duckdb
            web/
          retention-days: 7
          if-no-files-found: warn
