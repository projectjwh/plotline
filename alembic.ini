# App-state DB migrations (src/app). The URL comes from PLOTLINE_APP_DB_URL / DATABASE_URL
# through Settings, never from this file.
#   alembic upgrade head                       # apply (Fly runs this as the release command)
#   alembic revision --autogenerate -m "..."   # after changing a table in a module's repo.py
[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
